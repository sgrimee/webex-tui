name: CI

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

# webex-tui depends on webex-bridge (client feature) as a git dependency pinned
# by rev on github.com/sgrimee/webex-bridge; no sibling checkout is needed.
# Tests run on macOS: the pairing secret store is the macOS Keychain.

jobs:
  check:
    name: cargo check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  test:
    name: cargo test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
  
  lints:
    name: cargo clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - name: client-only dependency graph
        run: ./scripts/check-client-graph

  fmt:
    name: cargo fmt
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt
      - run: cargo fmt --all -- --check
