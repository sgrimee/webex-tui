[package]
authors = ["Sam Grimee <sgrimee@gmail.com>"]
categories = ["command-line-utilities"]
description = "A minimalist terminal user interface for Cisco Webex Teams"
documentation = "https://github.com/sgrimee/webex-tui"
edition = "2021"
homepage = "https://github.com/sgrimee/webex-tui"
keywords = ["cisco", "webex", "tui", "cli", "terminal"]
license = "MIT OR Apache-2.0"
name = "webex-tui"
repository = "https://github.com/sgrimee/webex-tui"
version = "0.9.0"

[dependencies]
arboard = { version = "3.6" }
base64 = "0.22"
sha2 = "0.10"
zeroize = "1.8"
chrono = "0.4"
clap = { version = "4", features = ["cargo"] }
color-eyre = "0.6"
dirs = "6"
enum-iterator = "2"
fuzzy-matcher = "0.3"
html2text = "0.16"
itertools = "0.14"
# O_NOFOLLOW for the private room dump.
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
textwrap = "0.16"
thiserror = "2.0"
# rt-multi-thread: #[tokio::main] runs the UI loop and the bridge runtime task in parallel.
tokio = { version = "1.43.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
webex-bridge = { git = "https://github.com/sgrimee/webex-bridge", rev = "8a5fb1d831fab74a0ad5a0e27e2c54096cac9992", default-features = false, features = ["client"] }

# UI dependencies - allow latest compatible versions
crossterm = "0.29"
ratatui = "0.29"
tui-logger = "0.17.4"
tui-textarea = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[dev-dependencies]
# Paused-clock tests (tokio::time::pause).
tokio = { version = "1.43.1", features = ["test-util"] }
# StatusCode for synthetic bridge ClientError values in tests.
http = "1"
rstest = "0.26.1"
tempfile = "3.0"
